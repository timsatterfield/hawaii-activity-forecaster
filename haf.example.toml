# Explicit configuration example; load_config() does not discover this file.
# These values match the approved M1 configuration baseline exactly.

[limits]
max_coordinator_iterations = 5
max_environmental_tool_invocations = 12
max_retries_per_failed_invocation = 1
max_fallback_attempts_per_evidence_gap = 1
max_concurrent_specialists = 2
max_recommendations = 3
max_llm_invocations = 12

[timeouts]
llm_request_seconds = 30
synthetic_tool_seconds = 10

[environment]
mode = "synthetic"

[llm]
enabled = false
# Provider and model_identifier remain unset. See haf.release.example.toml for explicit activation.

[trace]
directory = "traces"
format = "jsonl"
write_failure_policy = "fail_closed"

[langsmith]
enabled = false
