[project]
name = "hawaii-activity-forecaster"
version = "0.1.0"
description = "CMU Agentic AI Systems capstone: Maui ocean activity forecaster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "langgraph>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "openai>=3.56,<4.0",
    "langsmith>=0.8,<1.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]

[project.scripts]
hafi = "hawaii_activity_forecaster.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hawaii_activity_forecaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LangSmith is transitive through LangGraph; its optional pytest integration is unused.
addopts = "--strict-config --strict-markers -p no:langsmith_plugin"
